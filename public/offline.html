<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4A3A" />
    <title>Hors ligne · ARCHI-DESIGN Guinée</title>
    <!-- Page autonome (aucune ressource externe) affichée quand la connexion est coupée -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f1ec;
        --ink: #1c1e1d;
        --muted: #4e5752;
        --accent: #a0521e;
        --accent-ink: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151716;
          --ink: #f2f1ec;
          --muted: #aeb5af;
          --accent: #e0a46a;
          --accent-ink: #1c1e1d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
      }
      main { max-width: 32rem; display: flex; flex-direction: column; gap: 16px; }
      .frise {
        height: 10px;
        background:
          linear-gradient(135deg, #24305e 25%, transparent 25%) -5px 0 / 10px 10px,
          linear-gradient(225deg, #24305e 25%, transparent 25%) -5px 0 / 10px 10px,
          linear-gradient(315deg, #a0521e 25%, transparent 25%) 0 0 / 10px 10px,
          linear-gradient(45deg, #a0521e 25%, transparent 25%) 0 0 / 10px 10px;
      }
      h1 { margin: 0; font-size: 1.75rem; line-height: 1.1; }
      p { margin: 0; color: var(--muted); }
      button {
        align-self: flex-start;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="frise" aria-hidden="true"></div>
      <h1>Vous êtes hors ligne</h1>
      <p>La connexion est coupée. Les pages déjà consultées restent disponibles. Réessayez dès que le réseau revient.</p>
      <p lang="en">You are offline. Pages you already visited are still available.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
